    <style>
      html, body, #root { min-height: 100vh; margin: 0; padding: 0; background-color: #000; }
      html[data-theme="light"], html[data-theme="light"] body, html[data-theme="light"] #root { background-color: #EBECEF; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]), html:not([data-theme]) body, html:not([data-theme]) #root { background-color: #EBECEF; }
      }
      #root:empty::before { content: ''; position: fixed; inset: 0; background-color: inherit; z-index: 9999; }
      #chrome-tint { position: fixed; top: 0; left: 0; width: 100%; height: 12px; z-index: 10000; pointer-events: none; background-color: #000; mask-image: linear-gradient(transparent, transparent); -webkit-mask-image: linear-gradient(transparent, transparent); transition: background-color 0.4s linear; }
      html[data-theme="light"] #chrome-tint { background-color: #EBECEF; }
      @media (prefers-reduced-motion: reduce) { #chrome-tint { transition: none; } }
      ::view-transition-old(root), ::view-transition-new(root), ::view-transition-group(root) {
        animation-duration: 0.4s;
        animation-timing-function: linear;
      }
      html:active-view-transition a, html:active-view-transition button { transition: none; }
    </style>
    <script>
      (function () {
        var saved = localStorage.getItem('portfolio-theme-mode');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var mode = saved === 'dark' || saved === 'light' ? saved : dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', mode);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'light' ? '#EBECEF' : '#000000');
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) { registration.unregister(); });
        });
      }
    </script>
