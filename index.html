    <!-- Critical CSS to prevent flash - theme aware -->
    <style>
      html, body, #root {
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }
      /* Dark mode */
      html[data-theme="dark"], 
      html[data-theme="dark"] body, 
      html[data-theme="dark"] #root {
        background-color: #000000;
      }
      /* Light mode */
      html[data-theme="light"], 
      html[data-theme="light"] body, 
      html[data-theme="light"] #root {
        background-color: #EBECEF;
      }
      /* Fallback based on system preference (before JS runs) */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]), body, #root {
          background-color: #000000;
        }
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]), body, #root {
          background-color: #EBECEF;
        }
      }
      /* Cover until React loads */
      #root:empty::before {
        content: '';
        position: fixed;
        inset: 0;
        background-color: inherit;
        z-index: 9999;
      }
    </style>
    <!-- Set theme before paint to prevent flash -->
    <script>
      (function() {
        var savedTheme = localStorage.getItem('portfolio-theme-mode');
        var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (savedTheme === 'dark' || savedTheme === 'light') 
          ? savedTheme 
          : (systemPrefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    
    <!-- Preload critical images - WebP preferred. The nav mark is inline SVG, so the

    <!-- Theme cross-fade. Inlined, not in createGlobalStyle: runtime-injected globals go stale across hot reloads, and a .css file would cost a render-blocking request. -->
    <style>
      /* Linear: plus-lighter blending needs complementary opacities, and a curved ramp makes brightness move unevenly. */
      ::view-transition-old(root),
      ::view-transition-new(root),
      ::view-transition-group(root) {
        animation-duration: 0.4s;
        animation-timing-function: linear;
      }

      /* Otherwise links repaint their own colour on top of the cross-fade. */
      html:active-view-transition a,
      html:active-view-transition button {
        transition: none;
      }
    </style>

    <!-- Unregister old PWA service workers and clear caches -->
    <script>
      if ('serviceWorker' in navigator) {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) { registration.unregister(); });
        });
      }
    </script>
